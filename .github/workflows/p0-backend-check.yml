name: P0-P2 backend checks

on:
  push:
    branches:
      - feat/wechat-pay-v3
  pull_request:
  workflow_dispatch:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
      ENABLE_MOCK_PAYMENT: "true"
      WECHAT_VIRTUALPAY_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Capture migration check
        id: migration_check
        shell: bash
        run: |
          set +e
          python manage.py makemigrations accounts catalog earnings --check --dry-run --verbosity 3 > migration-check.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check
          path: migration-check.txt
      - name: Enforce migration check
        if: steps.migration_check.outputs.exit_code != '0'
        run: |
          cat migration-check.txt
          exit 1
      - name: Run Django checks
        run: python manage.py check
      - name: Run P0-P2 regression tests
        run: python manage.py test apps.earnings apps.orders.test_p0_pricing apps.accounts.test_p2 --verbosity 2
