name: P0-P2 backend checks

on:
  push:
    branches:
      - feat/wechat-pay-v3
  pull_request:
  workflow_dispatch:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
      # CI 默认保持订单删除关闭；专项测试会在单个用例中显式覆盖环境变量。
      ADMIN_ORDER_DELETE_ENABLED: "false"
      ENABLE_MOCK_PAYMENT: "true"
      WECHAT_VIRTUALPAY_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Capture migration check
        id: migration_check
        shell: bash
        run: |
          set +e
          python manage.py makemigrations accounts catalog earnings orders payments players refunds wallet support --check --dry-run --verbosity 3 > migration-check.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-check
          path: migration-check.txt
      - name: Enforce migration check
        if: steps.migration_check.outputs.exit_code != '0'
        run: |
          cat migration-check.txt
          exit 1
      - name: Run Django checks
        run: python manage.py check
      - name: Capture P0-P2 regression tests
        id: regression_tests
        shell: bash
        run: |
          set +e
          python manage.py test apps.common.test_purchase_guard apps.earnings apps.orders.test_admin_delete apps.orders.test_order_cancellation apps.orders.test_player_cancellations apps.orders.test_matching_flow apps.orders.test_payment_deadlines apps.orders.test_room_entry_requeue apps.orders.test_p0_pricing apps.orders.test_designated_pricing apps.orders.test_designations apps.orders.test_escort_order_qualification apps.orders.test_cart_batch_orders apps.orders.test_service_duration apps.orders.test_shared_player_service_listings apps.payments.test_payment_deadline_alignment apps.payments.test_virtualpay apps.payments.test_closed_virtual_payment apps.payments.test_unified_diamond_refunds apps.payments.test_admin_search apps.refunds.tests apps.players.tests apps.players.test_application_submission apps.players.test_escort_qualification apps.accounts.test_default_nickname apps.accounts.test_p2 apps.accounts.test_account_restrictions apps.wallet.test_wallet_creation apps.wallet.test_balance_payment apps.wallet.test_balance_refund_auto apps.support --verbosity 2 > test-results.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
      - name: Enforce regression tests
        if: steps.regression_tests.outputs.exit_code != '0'
        run: |
          cat test-results.txt
          exit 1
